services:
  - type: web
    name: dawena-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
